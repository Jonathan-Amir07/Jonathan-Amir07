name: Update README card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/readme.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update README card"
          TIMESTAMP=$(date +%s)
          sed -i -E "s|(raw\.githubusercontent\.com/Jonathan-Amir07/Jonathan-Amir07/main/assets/readme\.svg)(\?t=[0-9]+)?|\1?t=${TIMESTAMP}|g" README.md
          git add README.md
          git diff --staged --quiet || git commit -m "Bust CDN cache for SVG assets"
          git pull --rebase
          git push
